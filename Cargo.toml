# The mod's crate. Its id and version are horizon-mod.toml's, not these.
[package]
name = "mod-chop"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Chop! has no other dependency.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
